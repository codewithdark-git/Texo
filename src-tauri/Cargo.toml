[package]
name = "texo"
version = "1.2.0"
description = "Texo — a desktop LaTeX editor"
edition = "2021"
license = "MIT"

[lib]
name = "texo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
trash = "5"
thiserror = "2"
dirs = "6"
notify-debouncer-mini = "0.7"
base64 = "0.22"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
# AI helper: HTTPS calls to the provider the user picked (rustls, honours
# HTTP(S)_PROXY / NO_PROXY), and API keys kept in the OS credential store.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "system-proxy"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
# Change history: a private git repo per project in .texo/history. libgit2 is
# built from source (no network, no OpenSSL), so users don't need git.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# Agents: the `search` tool and file globs (already in the tree via other crates).
regex = "1"
# Paper library: one SQLite file with full-text search (FTS5). `bundled`
# compiles SQLite from source, so no system library is needed.
rusqlite = { version = "0.42.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
