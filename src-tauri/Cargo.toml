[package]
name = "texo"
version = "0.1.0"
description = "Texo — a desktop AI LaTeX editor"
edition = "2021"
license = "MIT"

[lib]
name = "texo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
trash = "5"
thiserror = "2"
dirs = "6"
notify-debouncer-mini = "0.7"
base64 = "0.22"
flate2 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
